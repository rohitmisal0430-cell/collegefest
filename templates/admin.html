<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body{
            font-family: Arial;
            background:#0f0f0f;
            color:white;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#00ffcc;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:#1a1a1a;
        }

        th, td{
            padding:12px;
            border:1px solid #333;
            text-align:center;
        }

        th{
            background:#00ffcc;
            color:black;
        }

        tr:nth-child(even){
            background:#222;
        }

        .btn{
            display:inline-block;
            margin:15px 10px;
            padding:10px 20px;
            background:#00ffcc;
            color:black;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

        .delete-btn{
            background:#ff4d4d;
            color:white;
            padding:6px 10px;
            border-radius:6px;
            text-decoration:none;
        }

        .center{
            text-align:center;
        }
    </style>
</head>
<body>

<h1>📋 Admin Panel — Participants List</h1>

<div class="center">
    <a href="/download" class="btn">⬇ Download Excel</a>
    <a href="/" class="btn">⬅ Back to Home</a>
</div>

<table>
    <tr>
        <th>#</th>
        <th>Event</th>
        <th>Name</th>
        <th>Course</th>
        <th>Year</th>
        <th>Phone</th>
        <th>Category</th>
        <th>Action</th>
    </tr>

    {% for r in registrations %}
    <tr>
        <td>{{ loop.index0 }}</td>
        <td>{{ r[0] }}</td>
        <td>{{ r[1] }}</td>
        <td>{{ r[2] }}</td>
        <td>{{ r[3] }}</td>
        <td>{{ r[4] }}</td>
        <td>{{ r[5] }}</td>
        <td>
            <a href="/delete/{{ loop.index0 }}" class="delete-btn">Delete</a>
        </td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
