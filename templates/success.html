<!DOCTYPE html>
<html>
<head>
    <title>Success</title>
    <style>
        body{
            font-family: Arial;
            background:#0f0f0f;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .box{
            background:#1a1a1a;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 20px rgba(0,255,204,0.3);
        }
        h2{color:#00ffcc;}
        a{
            display:inline-block;
            margin-top:20px;
            padding:10px 20px;
            background:#00ffcc;
            color:black;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎉 Registration Successful!</h2>
        <p>Thank you <b>{{name}}</b> for registering.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
